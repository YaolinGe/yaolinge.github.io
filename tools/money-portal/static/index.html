<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Money Portal</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="page">
    <header class="panel header-panel">
        <div>
            <h1>Money</h1>
            <p class="subtitle" id="ledgerPath">loading ledger…</p>
        </div>
        <div class="header-figure">
            <span class="stat-label">This month</span>
            <strong id="monthTotal">–</strong>
        </div>
    </header>

    <p id="problemBanner" class="banner" hidden></p>

    <section class="panel">
        <form id="entryForm" autocomplete="off">
            <div class="amount-row">
                <label class="field amount-field">
                    <span>Amount</span>
                    <input id="amount" name="amount" type="text" inputmode="decimal"
                           placeholder="0.00" required autofocus>
                </label>
                <label class="field currency-field">
                    <span>Currency</span>
                    <input id="currency" name="currency" type="text" maxlength="3" size="3">
                </label>
            </div>

            <div class="field">
                <span>Category</span>
                <div id="categoryChips" class="chips"></div>
                <input id="category" name="category" type="text" list="categoryList"
                       placeholder="groceries">
                <datalist id="categoryList"></datalist>
            </div>

            <div class="grid-two">
                <label class="field">
                    <span>Date</span>
                    <input id="date" name="date" type="date" required>
                </label>
                <label class="field">
                    <span>Paid with</span>
                    <select id="method" name="method"></select>
                </label>
            </div>

            <label class="field">
                <span>Note</span>
                <input id="description" name="description" type="text" placeholder="what was it for">
            </label>

            <div class="actions">
                <button id="submitBtn" type="submit">Add entry</button>
                <button id="scanBtn" type="button" class="ghost" title="Receipt scanning is not built yet">
                    Scan receipt
                </button>
            </div>
            <p id="formMessage" class="form-message" aria-live="polite"></p>
        </form>
    </section>

    <section class="panel">
        <div class="stats-grid">
            <div><span class="stat-label">Today</span><strong id="todayTotal">–</strong></div>
            <div><span class="stat-label">Daily average</span><strong id="dailyAverage">–</strong></div>
            <div><span class="stat-label">Entries</span><strong id="entryCount">–</strong></div>
            <div><span class="stat-label">All time</span><strong id="allTimeTotal">–</strong></div>
        </div>
        <div id="categoryBars" class="bars"></div>
    </section>

    <section class="panel">
        <div class="list-controls">
            <label class="field">
                <span>Month</span>
                <select id="monthFilter"></select>
            </label>
            <label class="field">
                <span>Search</span>
                <input id="searchInput" type="search" placeholder="note, category or tag">
            </label>
        </div>
        <ul id="entryList" class="entries"></ul>
        <p id="emptyState" class="subtitle" hidden>Nothing recorded for this month yet.</p>
    </section>

    <footer class="panel foot">
        <span id="gitStatus">git sync: unknown</span>
        <button id="forgetToken" type="button" class="ghost" hidden>Forget token</button>
    </footer>
</main>
<script src="./app.js"></script>
</body>
</html>
