<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Water Drop & Waves Demo</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to bottom, #aeefff 0%, #e0f7fa 40%, #b3e5fc 100%);
            position: relative;
        }
        .sky {
            position: absolute;
            width: 100%;
            height: 35vh;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.8;
            box-shadow: 30px 10px 0 0 #fff, 60px 0px 0 0 #fff, 90px 15px 0 0 #fff;
            width: 80px;
            height: 40px;
            top: 10vh;
            left: 10vw;
            animation: cloudmove 40s linear infinite;
        }
        .cloud:nth-child(2) {
            top: 5vh;
            left: 40vw;
            width: 100px;
            height: 50px;
            opacity: 0.7;
            animation-delay: 10s;
        }
        .cloud:nth-child(3) {
            top: 15vh;
            left: 70vw;
            width: 70px;
            height: 35px;
            opacity: 0.6;
            animation-delay: 20s;
        }
        @keyframes cloudmove {
            0% { left: -15vw; }
            100% { left: 110vw; }
        }
        .surface {
            position: absolute;
            top: 35vh;
            left: 0;
            width: 100vw;
            height: 8vh;
            z-index: 2;
            pointer-events: none;
        }
        .wave {
            position: absolute;
            width: 100vw;
            height: 100%;
            left: 0;
            top: 0;
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" viewBox="0 0 120 20" xmlns="http://www.w3.org/2000/svg"><path d="M0 10 Q 10 0 20 10 T 40 10 T 60 10 T 80 10 T 100 10 T 120 10 V20 H0Z" fill="%2300bcd4" /></svg>');
            background-size: 120vw 100%;
            animation: waveMove 4s linear infinite;
            opacity: 0.9;
        }
        @keyframes waveMove {
            0% { background-position-x: 0; }
            100% { background-position-x: -120vw; }
        }
        .water-bottom {
            position: absolute;
            top: 43vh;
            left: 0;
            width: 100vw;
            height: 57vh;
            background: linear-gradient(to bottom, #00bcd4 0%, #2196f3 100%);
            z-index: 3;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #81d4fa 60%, #0288d1 100%);
            box-shadow: 0 2px 8px 0 #0288d1aa;
            z-index: 4;
            pointer-events: none;
            animation: drop-fall 1s cubic-bezier(.5,1.5,.5,1) forwards;
        }
        @keyframes drop-fall {
            0% { transform: translateY(0); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(50vh); opacity: 0.8; }
        }
        .ripple {
            position: absolute;
            width: 0;
            height: 0;
            left: 50%;
            top: 95%;
            border-radius: 50%;
            border: 2px solid #fff;
            opacity: 0.7;
            pointer-events: none;
            z-index: 5;
            animation: ripple-anim 1s ease-out forwards;
        }
        @keyframes ripple-anim {
            0% { width: 0; height: 0; opacity: 0.7; }
            80% { opacity: 0.5; }
            100% { width: 60px; height: 18px; margin-left: -30px; margin-top: -9px; opacity: 0; }
        }
        .instruction {
            position: absolute;
            top: 5vh;
            left: 50%;
            transform: translateX(-50%);
            color: #01579b;
            font-size: 1.2em;
            background: rgba(255,255,255,0.7);
            padding: 0.5em 1em;
            border-radius: 1em;
            z-index: 10;
            font-family: sans-serif;
            box-shadow: 0 2px 8px #b3e5fc66;
        }
    </style>
</head>
<body>
    <div class="sky">
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>
    <div class="surface">
        <div class="wave"></div>
    </div>
    <div class="water-bottom" id="water-bottom"></div>
    <div class="instruction">Click anywhere to drop water and make waves!</div>
    <script>
        document.body.addEventListener('click', function(event) {
            // Only trigger if click is above the water-bottom
            const waterBottom = document.getElementById('water-bottom');
            const rect = waterBottom.getBoundingClientRect();
            if (event.clientY < rect.top) {
                const drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = (event.clientX - 9) + 'px';
                drop.style.top = (rect.top - 18) + 'px';
                document.body.appendChild(drop);

                // After drop animation, create ripple
                drop.addEventListener('animationend', function() {
                    const ripple = document.createElement('div');
                    ripple.className = 'ripple';
                    ripple.style.left = (event.clientX) + 'px';
                    ripple.style.top = (rect.top + rect.height * 0.95) + 'px';
                    document.body.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 1000);
                    drop.remove();
                });
            }
        });
    </script>
</body>
</html>
